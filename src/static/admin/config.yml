# ──────────────────────────────────────────────────────────────────────────────
# Sveltia CMS configuration for Azure Thursday
# Docs: https://github.com/sveltia/sveltia-cms
#
# Sveltia CMS uses GitHub's PKCE OAuth flow — no proxy server needed.
#
# AUTH SETUP (one-time, ~2 minutes)
# ───────────────────────────────────
#   1. Go to: GitHub → Settings → Developer settings → OAuth Apps → New OAuth App
#        Application name:  Azure Thursday CMS
#        Homepage URL:      https://yourdomain.com  (or https://azure-thursday.github.io if no custom domain)
#        Callback URL:      https://yourdomain.com/admin/
#
#   2. Click "Register application", then copy the Client ID shown.
#
#   3. Paste the Client ID as the value of app_id below.
#      (No client secret needed — that's the point of PKCE.)
#
# LOCAL DEVELOPMENT
# ──────────────────
# Run the local backend alongside Hugo:
#   npx @sveltia/cms-local-backend   (in one terminal)
#   hugo server --source src         (in another)
# Then open http://localhost:1313/admin/
# ──────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: azure-thursday/azure-thursday.github.io
  branch: main
  auth_type: pkce
  app_id: YOUR_GITHUB_OAUTH_APP_CLIENT_ID   # paste your Client ID here

local_backend: true

media_folder: src/static/images/speaker
public_folder: /images/speaker

# ── Reusable speaker fields ───────────────────────────────────────────────────
_speaker_fields: &speaker_fields
  - { label: Name,       name: name,     widget: string }
  - { label: Job title,  name: title,    widget: string }
  - { label: Photo,      name: imageUrl, widget: image, required: false }
  - label: Socials
    name: socials
    widget: list
    required: false
    fields:
      - label: Icon
        name: icon
        widget: select
        options:
          - { label: LinkedIn,  value: fa-linkedin }
          - { label: Twitter/X, value: fa-twitter }
          - { label: GitHub,    value: fa-github }
          - { label: YouTube,   value: fa-youtube }
          - { label: Bluesky,   value: fa-bluesky }
      - { label: URL, name: url, widget: string }

# ── Reusable session fields ───────────────────────────────────────────────────
_session_fields: &session_fields
  - { label: Slug,       name: slug,      widget: string, hint: "URL-safe identifier, e.g. my-session-title" }
  - { label: Meetup,     name: meetup,    widget: string, hint: "e.g. Meetup May 2026" }
  - { label: Date,       name: date,      widget: string, hint: "e.g. 7 May 2026" }
  - { label: Start time, name: startTime, widget: string, hint: "e.g. 18:45" }
  - { label: End time,   name: endTime,   widget: string, hint: "e.g. 19:30" }
  - { label: Time zone,  name: timeZone,  widget: string, hint: "e.g. UTC+01:00 Europe/Amsterdam" }
  - { label: Title,      name: title,     widget: string }
  - { label: Description, name: description, widget: text }
  - label: Speakers
    name: speakers
    widget: list
    fields: *speaker_fields

collections:

  # ── 1. Current Event ─────────────────────────────────────────────────────────
  - name: current-event
    label: "📅 Current Event"
    files:
      - label: Event details
        name: event
        file: src/data/event.json
        fields:
          - { label: Next event date,    name: nextEventDate,      widget: string, hint: "Format: DD/MM/YYYY" }
          - { label: Meetup register URL, name: meetupRegisterUrl, widget: string }
          - label: Header image
            name: headerImageUrl
            widget: image
            media_folder: /src/static/images/header
            public_folder: /images/header

  # ── 2. Current Sessions ───────────────────────────────────────────────────────
  - name: current-sessions
    label: "🎤 Current Sessions"
    files:
      - label: Sessions
        name: sessions
        file: src/data/sessions.json
        fields:
          - label: Sessions
            name: sessions
            widget: list
            summary: "{{fields.title}}"
            fields: *session_fields

  # ── 3. Past Events Index ──────────────────────────────────────────────────────
  - name: past-events-index
    label: "📋 Past Events Index"
    files:
      - label: Past events index
        name: pasteventsindex
        file: src/data/pasteventsindex.json
        fields:
          - label: Events
            name: events
            widget: list
            summary: "{{fields.key}}"
            hint: "Ordered newest-first. Each key must match a MM-YYYY.json file in src/data."
            fields:
              - { label: "Key (MM-YYYY)", name: key,            widget: string, hint: "e.g. 11-2025" }
              - { label: Header image,    name: headerImageUrl, widget: image, required: false,
                  media_folder: /src/static/images/header, public_folder: /images/header }
              - { label: Meetup URL,      name: meetupUrl,      widget: string, required: false }

  # ── 4. Past Event Sessions ────────────────────────────────────────────────────
  - name: past-event-sessions
    label: "📦 Past Event Sessions"
    files:
      - { label: "October 2023",   name: "10-2023", file: "src/data/10-2023.json", fields: [{ label: Sessions, name: sessions, widget: list, summary: "{{fields.title}}", fields: *session_fields }] }
      - { label: "December 2023",  name: "12-2023", file: "src/data/12-2023.json", fields: [{ label: Sessions, name: sessions, widget: list, summary: "{{fields.title}}", fields: *session_fields }] }
      - { label: "March 2024",     name: "03-2024", file: "src/data/03-2024.json", fields: [{ label: Sessions, name: sessions, widget: list, summary: "{{fields.title}}", fields: *session_fields }] }
      - { label: "June 2024",      name: "06-2024", file: "src/data/06-2024.json", fields: [{ label: Sessions, name: sessions, widget: list, summary: "{{fields.title}}", fields: *session_fields }] }
      - { label: "September 2024", name: "09-2024", file: "src/data/09-2024.json", fields: [{ label: Sessions, name: sessions, widget: list, summary: "{{fields.title}}", fields: *session_fields }] }
      - { label: "October 2024",   name: "10-2024", file: "src/data/10-2024.json", fields: [{ label: Sessions, name: sessions, widget: list, summary: "{{fields.title}}", fields: *session_fields }] }
      - { label: "December 2024",  name: "12-2024", file: "src/data/12-2024.json", fields: [{ label: Sessions, name: sessions, widget: list, summary: "{{fields.title}}", fields: *session_fields }] }
      - { label: "June 2025",      name: "06-2025", file: "src/data/06-2025.json", fields: [{ label: Sessions, name: sessions, widget: list, summary: "{{fields.title}}", fields: *session_fields }] }
      - { label: "July 2025",      name: "07-2025", file: "src/data/07-2025.json", fields: [{ label: Sessions, name: sessions, widget: list, summary: "{{fields.title}}", fields: *session_fields }] }
      - { label: "September 2025", name: "09-2025", file: "src/data/09-2025.json", fields: [{ label: Sessions, name: sessions, widget: list, summary: "{{fields.title}}", fields: *session_fields }] }
      - { label: "October 2025",   name: "10-2025", file: "src/data/10-2025.json", fields: [{ label: Sessions, name: sessions, widget: list, summary: "{{fields.title}}", fields: *session_fields }] }
      - { label: "November 2025",  name: "11-2025", file: "src/data/11-2025.json", fields: [{ label: Sessions, name: sessions, widget: list, summary: "{{fields.title}}", fields: *session_fields }] }
