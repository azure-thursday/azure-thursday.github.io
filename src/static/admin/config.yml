# ──────────────────────────────────────────────────────────────────────────────
# Sveltia CMS configuration for Azure Thursday
# Docs: https://sveltiacms.app/en/docs/backends/github
#
# AUTH — TWO OPTIONS
# ───────────────────
# OPTION A · Personal Access Token (works right now, zero extra setup)
#   Editors click "Sign in with Token" on the login screen and paste a
#   GitHub personal access token (repo scope). Nothing to configure here.
#
# OPTION B · OAuth via Sveltia CMS Authenticator (more polished login UX)
#   1. Deploy https://github.com/sveltia/sveltia-cms-auth to Cloudflare Workers
#      (free tier — takes ~5 minutes, one-click deploy available in that repo)
#   2. Set base_url below to your deployed worker URL, e.g.:
#        base_url: https://sveltia-cms-auth.your-account.workers.dev
#
# LOCAL DEVELOPMENT
# ──────────────────
# Run the local backend alongside Hugo:
#   npx @sveltia/cms-local-backend   (in one terminal)
#   hugo server --source src         (in another)
# Then open http://localhost:1313/admin/
# Uncomment local_backend below while developing locally.
# ──────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: azure-thursday/azure-thursday.github.io
  branch: main
  # base_url: https://YOUR_CLOUDFLARE_WORKER_URL  # uncomment for Option B

# local_backend: true

media_folder: src/static/images/speaker
public_folder: /images/speaker

collections:

  - name: events
    label: "📅 Events"
    folder: src/content/events
    create: true
    format: json-frontmatter
    extension: md
    slug: "{{fields.eventDate}}-{{slug}}"
    summary: "{{fields.eventDate}} - {{title}}"
    sortable_fields: [eventDate, title]
    filter: { field: layout, value: event }
    fields:
      - { label: Title, name: title, widget: string }
      - label: Event date
        name: eventDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        hint: "The earliest published event is highlighted through its event day in Europe/Amsterdam. Do not use Hugo's reserved date field for the event date."
      - { label: Draft, name: draft, widget: boolean, default: true, hint: "Turn off to advertise this event." }
      - { name: layout, widget: hidden, default: event }
      - { name: outputs, widget: hidden, default: [HTML, Calendar] }
      - { label: Summary, name: summary, widget: text, required: false }
      - { label: Meetup register URL, name: meetupRegisterUrl, widget: string, required: false }
      - { label: Location, name: location, widget: string, required: false }
      - { label: Starts at, name: startsAt, widget: string, required: false, hint: "Optional: 2026-11-05T18:00:00+01:00. Set both start and end, including UTC offset. Otherwise the calendar uses an all-day placeholder." }
      - { label: Ends at, name: endsAt, widget: string, required: false, hint: "Optional: 2026-11-05T21:00:00+01:00. Use +02:00 during Dutch summer time." }
      - label: Header image
        name: headerImageUrl
        widget: image
        required: false
        media_folder: /src/static/images/header
        public_folder: /images/header
      - { label: Header image description, name: headerImageAlt, widget: string, required: false }
      - { label: Event details, name: body, widget: markdown, required: false }
      - label: Sessions
        name: sessions
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: Slug, name: slug, widget: string, hint: "Unique within this event, e.g. my-session-title" }
          - { label: Meetup, name: meetup, widget: string, hint: "e.g. Meetup November 2026" }
          - { label: Date, name: date, widget: string, hint: "e.g. 5 November 2026" }
          - { label: Start time, name: startTime, widget: string, hint: "e.g. 18:45" }
          - { label: End time, name: endTime, widget: string, hint: "e.g. 19:30" }
          - { label: Time zone, name: timeZone, widget: string, hint: "e.g. UTC+01:00 Europe/Amsterdam" }
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Hide read more, name: hideReadMore, widget: boolean, default: false, required: false }
          - label: Speakers
            name: speakers
            widget: list
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Job title, name: title, widget: string }
              - { label: Photo, name: imageUrl, widget: image, required: false }
              - label: Socials
                name: socials
                widget: list
                required: false
                fields:
                  - label: Icon
                    name: icon
                    widget: select
                    options:
                      - { label: LinkedIn, value: fa-linkedin }
                      - { label: Twitter/X, value: fa-twitter }
                      - { label: GitHub, value: fa-github }
                      - { label: YouTube, value: fa-youtube }
                      - { label: Bluesky, value: fa-bluesky }
                  - { label: URL, name: url, widget: string }

  # ── 3. Past Events Index ──────────────────────────────────────────────────────
  - name: past-events-index
    label: "📋 Past Events Index"
    files:
      - label: Past events index
        name: pasteventsindex
        file: src/data/pasteventsindex.json
        fields:
          - label: Events
            name: events
            widget: list
            summary: "{{fields.key}}"
            hint: "Ordered newest-first. Each key must match a MM-YYYY.json file in src/data."
            fields:
              - { label: "Key (MM-YYYY)", name: key,            widget: string,  hint: "e.g. 11-2025" }
              - { label: Meetup URL,      name: meetupUrl,      widget: string,  required: false }
              - label: Header image
                name: headerImageUrl
                widget: image
                required: false
                media_folder: /src/static/images/header
                public_folder: /images/header

