<article class="upcoming-event-preview">
  <time class="upcoming-event-date strong" datetime="{{ .Params.eventDate }}" aria-label="{{ time.Format "2 January 2006" .Params.eventDate }}">
    <span class="upcoming-event-day">{{ time.Format "2" .Params.eventDate }}</span>
    <span>{{ time.Format "January" .Params.eventDate }}</span>
    <span class="upcoming-event-year">{{ time.Format "2006" .Params.eventDate }}</span>
  </time>
  <div class="upcoming-event-info">
    <h3 class="session-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    {{ with .Params.location }}<p class="upcoming-event-location"><i class="fas fa-map-marker-alt" aria-hidden="true"></i> {{ . }}</p>{{ end }}
    {{ with .Params.summary }}<p class="mb-0">{{ . }}</p>{{ end }}
  </div>
  <a href="{{ .RelPermalink }}" class="btn btn-primary strong upcoming-event-details" aria-label="Event details for {{ .Title }}">Event details</a>
</article>
